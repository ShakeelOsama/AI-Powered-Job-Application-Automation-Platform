[program:celery_worker]
directory=/var/www/job_apply/server
command=/var/www/job_apply/server/venv/bin/celery -A app.core.celery_config worker --loglevel=info --concurrency=2
autostart=true
autorestart=true
stderr_logfile=/var/log/celery_worker.err.log
stdout_logfile=/var/log/celery_worker.out.log
user=www-data
environment=PATH="/var/www/job_apply/server/venv/bin"
stopwaitsecs=600
killasgroup=true
priority=1000

[group:celery]
programs=celery_worker
